name: Validate Plugin Registry
on:
  pull_request:
    paths:
      - 'runtimes/registry.json'
      - 'templates/registry.json'
      - 'adapters/registry.json'
      - 'telemetry/registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install JSON Schema Validator
        run: npm install -g ajv-cli
        
      - name: Validate runtimes/registry.json
        run: ajv validate -s schemas/runtime.schema.json -d runtimes/registry.json
        if: hashFiles('runtimes/registry.json') != ''
        
      - name: Validate templates/registry.json
        run: ajv validate -s schemas/template.schema.json -d templates/registry.json
        if: hashFiles('templates/registry.json') != ''
        
      - name: Validate adapters/registry.json
        run: ajv validate -s schemas/adapter.schema.json -d adapters/registry.json
        if: hashFiles('adapters/registry.json') != ''
        
      - name: Validate telemetry/registry.json
        run: ajv validate -s schemas/telemetry.schema.json -d telemetry/registry.json
        if: hashFiles('telemetry/registry.json') != ''
