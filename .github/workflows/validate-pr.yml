name: Validate Plugin Manifests
on:
  pull_request:
    paths:
      - 'runtimes/manifests/*.json'
      - 'templates/manifests/*.json'
      - 'adapters/manifests/*.json'
      - 'telemetry/manifests/*.json'
      - 'memory/manifests/*.json'
      - 'renderers/manifests/*.json'
      - 'widgets/manifests/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install JSON Schema Validator
        run: npm install -g ajv-cli ajv-formats
        
      - name: Validate runtimes
        run: |
          shopt -s nullglob
          failed=0
          for f in runtimes/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/runtime.schema.json -d "$f" || failed=1
          done
          exit $failed
        
      - name: Validate templates
        run: |
          shopt -s nullglob
          failed=0
          for f in templates/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/template.schema.json -d "$f" || failed=1
          done
          exit $failed
        
      - name: Validate adapters
        run: |
          shopt -s nullglob
          failed=0
          for f in adapters/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/adapter.schema.json -d "$f" || failed=1
          done
          exit $failed
        
      - name: Validate telemetry
        run: |
          shopt -s nullglob
          failed=0
          for f in telemetry/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/telemetry.schema.json -d "$f" || failed=1
          done
          exit $failed

      - name: Validate memory
        run: |
          shopt -s nullglob
          failed=0
          for f in memory/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/memory.schema.json -d "$f" || failed=1
          done
          exit $failed

      - name: Validate renderers
        run: |
          shopt -s nullglob
          failed=0
          for f in renderers/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/renderers.schema.json -d "$f" || failed=1
          done
          exit $failed

      - name: Validate widgets
        run: |
          shopt -s nullglob
          failed=0
          for f in widgets/manifests/*.json; do
            [ "$(basename "$f")" = "_example.json" ] && continue
            echo "Validating $f..."
            ajv validate -c ajv-formats -s schemas/widgets.schema.json -d "$f" || failed=1
          done
          exit $failed
